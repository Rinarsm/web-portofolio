<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 450" role="img" aria-label="KNN and Random Forest classification evaluation">
  <rect width="800" height="450" rx="28" fill="#f7fbfe"/>
  <text x="48" y="58" font-family="Arial, sans-serif" font-size="27" font-weight="700" fill="#17324a">Classification Performance</text>
  <text x="48" y="89" font-family="Arial, sans-serif" font-size="15" fill="#5f7386">Beverage Sales cluster-label classification</text>
  <line x1="78" y1="360" x2="742" y2="360" stroke="#d9e8f3" stroke-width="2"/>
  <line x1="78" y1="128" x2="78" y2="360" stroke="#d9e8f3" stroke-width="2"/>
  <text x="45" y="365" font-family="Arial" font-size="13" fill="#8295a7">0</text>
  <text x="36" y="250" font-family="Arial" font-size="13" fill="#8295a7">50%</text>
  <text x="30" y="136" font-family="Arial" font-size="13" fill="#8295a7">100%</text>
  <line x1="78" y1="244" x2="742" y2="244" stroke="#e7f1f8" stroke-dasharray="6 7"/>
  <line x1="78" y1="128" x2="742" y2="128" stroke="#e7f1f8" stroke-dasharray="6 7"/>
  <!-- KNN -->
  <rect x="165" y="131" width="150" height="229" rx="15" fill="#89CFF0"/>
  <text x="240" y="117" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#3e98c9">99.98%</text>
  <text x="240" y="394" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#17324a">KNN</text>
  <!-- RF -->
  <rect x="485" y="130" width="150" height="230" rx="15" fill="#4fb8f4"/>
  <text x="560" y="116" text-anchor="middle" font-family="Arial" font-size="17" font-weight="700" fill="#258dc7">99.99%</text>
  <text x="560" y="394" text-anchor="middle" font-family="Arial" font-size="18" font-weight="700" fill="#17324a">Random Forest</text>
  <text x="400" y="428" text-anchor="middle" font-family="Arial" font-size="14" fill="#6b7f91">Weighted accuracy / precision / recall / F1 are all above 99.98%</text>
</svg>